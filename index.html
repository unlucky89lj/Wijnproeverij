<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wijnproeverij</title>
<meta name="description" content="Samen blind wijn proeven: rad, vragenlijst, uitslag en wijnlijst.">
<meta name="theme-color" content="#6E1A2D" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1A0F13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="Wijnproeverij">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="firebase-config.js"></script>
<script>if(window.FIREBASE_CONFIG){["app","auth","firestore"].forEach(function(m){document.write('<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-'+m+'-compat.js"><\/script>')})}</script>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add_circle,cake,calendar_month,celebration,checklist,eco,emoji_events,euro,event_available,favorite,flag,flight_takeoff,format_list_bulleted,gavel,home,local_florist,local_pizza,lock,map,military_tech,palette,photo_camera,photo_library,play_circle,public,qr_code_scanner,savings,school,search,spa,star,sunny,swords,sync,thumb_up,track_changes,travel_explore,visibility_off,wine_bar,workspace_premium&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a tasting sheet on a clipboard; sticky tab bar, cards only for beers. */
:root{
  --bg:#F5F1EA; --sea:#DCE4EA; --surface:#FFFFFF; --sunk:#ECE5D8; --line:#DDD2BE;
  --ink:#1E1519; --muted:#6B6152;
  --amber:#6E1A2D; --amber-soft:#F1E4C8; --hop:#4F6B3A; --hop-soft:#DFE8D5;
  --danger:#A6352A;
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A0F13; --sea:#141218; --surface:#26151B; --sunk:#331F27; --line:#4A2C36;
  --ink:#F3E8EA; --muted:#B89AA3;
  --amber:#B89C68; --amber-soft:#3D1E28; --hop:#9DBE7C; --hop-soft:#243020;
  --danger:#E07A6E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A0F13; --sea:#141218; --surface:#26151B; --sunk:#331F27; --line:#4A2C36;
  --ink:#F3E8EA; --muted:#B89AA3;
  --amber:#B89C68; --amber-soft:#3D1E28; --hop:#9DBE7C; --hop-soft:#243020;
  --danger:#E07A6E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding-block:14px 6px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:.5px;text-transform:uppercase;margin:0;line-height:1}
.brand h1 span{color:var(--amber)}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:0}
nav button{flex:1 1 0;min-width:0;appearance:none;border:0;background:none;color:var(--muted);font:500 11px var(--f-body);padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:3px solid transparent;cursor:pointer}
nav button small{font-size:11px;white-space:nowrap;letter-spacing:.01em}
@media (max-width:440px){nav button small{font-size:9.5px;letter-spacing:0}nav button{padding:8px 0 9px}}
nav .ico{position:relative;display:inline-flex}
.tab-mug{width:24px;height:24px;display:block}
nav button .badge[hidden]{display:none}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;display:inline-block;width:24px;height:24px;overflow:hidden}
nav button[aria-current="page"]{color:var(--amber);border-bottom-color:var(--amber)}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]:hover{color:var(--amber)}
nav button .badge{position:absolute;top:-4px;right:-12px;display:inline-block;min-width:17px;padding:0 4px;border-radius:9px;border:2px solid var(--bg);background:var(--amber);color:var(--surface);font:500 10px/14px var(--f-mono);text-align:center}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.3px;margin:0;line-height:1.05;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 8px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,.btn{font-family:var(--f-body)}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;padding:12px 18px;border-radius:999px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,nav button:focus-visible,.chip:focus-visible,.swatch:focus-visible,.row-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.linkbtn{appearance:none;background:none;border:0;padding:0;color:var(--amber);font-weight:600;cursor:pointer;font-size:14px}

/* feed rows */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row-btn{appearance:none;display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;color:var(--ink);cursor:pointer}
.thumb{width:60px;height:60px;border-radius:8px;object-fit:cover;background:var(--sunk);display:block}
.thumb.ph{display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:var(--muted)}
.row-main{min-width:0}
.row-main b{display:block;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.row-main span{font-size:13px;color:var(--muted)}
.pill{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:999px;white-space:nowrap}
.pill.todo{background:var(--amber-soft);color:var(--amber)}
.pill.done{background:var(--hop-soft);color:var(--hop)}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{max-width:42ch}

/* scan */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:220px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:center;padding:20px;position:relative;overflow:hidden}
.drop img{max-height:340px;border-radius:8px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cal-sub{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk)}
.cal-sub>.ms{color:var(--amber)}
.cal-sub b{display:block}.cal-sub small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.cal-sub .cal-btns,.cal-sub .note{grid-column:1/-1;margin:0}
.photo-btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.photo-btns .btn{cursor:pointer}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
.reveal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.origin{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.big-name{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],textarea,input[type=search]{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:14px}

/* questionnaire */
.sheet{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.q{padding:18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.q:last-child{border-bottom:0}
.q-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.q-head h3{margin:0;color:var(--ink);font-size:13px}
.q-head .mono{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--f-body);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.match{border-color:var(--hop);background:var(--hop-soft);color:var(--hop)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.swatch{appearance:none;border:2px solid transparent;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;color:var(--ink);min-width:0}
.swatch i{display:block;width:100%;aspect-ratio:1/1.3;max-width:100%;border-radius:6px 6px 14px 14px;border:1px solid var(--line)}
.swatch[aria-pressed="true"] i{outline:3px solid var(--amber);outline-offset:2px}
.swatch small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.scale{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.scale-dots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale-dots button{appearance:none;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font:500 13px var(--f-mono);color:var(--muted);cursor:pointer}
.scale-dots button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--surface)}
.scale-dots button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.score-out{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;color:var(--amber)}
input[type=range]{width:100%;accent-color:var(--amber)}
.sub{display:flex;flex-direction:column;gap:8px}
.sub+.sub{margin-top:4px}
.sub label{font-size:13px;font-weight:600}

/* results */
.hero-beer{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.hero-beer .thumb{width:96px;height:96px}
.scorebox{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.scorebox .score-out{font-size:64px}
.caps{display:flex;gap:4px}
.caps i{width:20px;height:20px;border-radius:50%;background:linear-gradient(90deg,var(--amber) var(--p,0%),var(--sunk) var(--p,0%));border:1px solid var(--line)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:96px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:10px;background:var(--sunk);border-radius:5px;position:relative;overflow:visible}
.bar-fill{position:absolute;inset:0 auto 0 0;background:var(--amber);border-radius:5px}
.bar-me{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;background:var(--amber);margin-right:6px;vertical-align:middle}
.legend i.me{width:3px;height:12px;background:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.panel.described{border-color:var(--hop);border-style:dashed}
.comments{display:flex;flex-direction:column;gap:12px}
.comment{display:grid;grid-template-columns:auto 1fr;gap:10px}
.comment img{width:28px;height:28px;border-radius:50%}
.comment b{font-size:13px}
.comment .mono{font-size:12px;color:var(--amber);margin-left:6px}
.comment p{font-size:14px;overflow-wrap:anywhere}
.kv{display:flex;gap:18px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column}
.kv span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-weight:500}
.back{align-self:flex-start}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rank li{display:grid;grid-template-columns:24px 28px 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rank li:last-child{border-bottom:0}
.rank li.me b{color:var(--amber)}
.rank .pos{grid-row:span 2;font-size:14px;color:var(--muted)}
.rank li:first-child .pos{color:var(--amber);font-weight:500}
.rank img{grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--sunk)}
.rank b{font-size:14px;min-width:0;overflow-wrap:anywhere}
.rank-val{grid-row:span 2;font-size:16px}
.rank-sub{font-size:12px;color:var(--muted);grid-column:3}
.stats{display:grid;grid-template-columns:repeat(3,1fr) 2fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats>div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;min-width:0}
.stats b{font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.stats .wide b{font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.stats span{font-size:12px;color:var(--muted)}
.listbar{display:flex;flex-direction:column;gap:10px}
.beer-row{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:start;border-bottom:1px solid var(--line);padding:12px 0}
.beer-row .pill{margin-top:2px}
.beer-row>.row-info{grid-column:2/-1;margin-top:-8px}
.beer-row>.row-info[open]{grid-column:1/-1}
.when{font-size:12px;color:var(--amber);margin:2px 0}
@media (max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}.stats .wide{grid-column:1/-1}}
.seg-count{font-size:11px;opacity:.75;margin-left:2px}.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;appearance:none;border:0;background:none;padding:8px 10px;border-radius:999px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
select{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.beer-row.cat{grid-template-columns:1fr auto}
.cat-act{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cat-act .buy-more{text-align:right}
.cat-act .buy-more .buys{justify-content:flex-end;max-width:280px}
.btn.small{padding:7px 12px;font-size:13px}
@media (max-width:480px){.beer-row.cat{grid-template-columns:1fr}.cat-act{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}.cat-act .buy-more{text-align:left;flex-basis:100%}.cat-act .buy-more .buys{justify-content:flex-start;max-width:none}}
.temp{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--ink);white-space:nowrap;vertical-align:middle}
.temp::before{content:"";display:inline-block;width:5px;height:9px;border:1.5px solid currentColor;border-radius:3px 3px 4px 4px;margin-right:5px;vertical-align:-1px}
.buys{display:flex;flex-wrap:wrap;gap:8px}
.buy{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;background:var(--bg)}
.buy::after{content:"↗";color:var(--amber)}
.buy:hover{border-color:var(--amber)}
.buy:focus-visible,.buy-more summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.buy-more summary{list-style:none;cursor:pointer}
.buy-more summary::-webkit-details-marker{display:none}
.buy-more[open] .buys{margin-top:8px}
.rank .thumb.mini{grid-row:span 2;width:28px;height:28px;border-radius:6px;font-size:14px}
b.inline{display:inline;font-size:inherit}
.answers{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ans{border-bottom:1px solid var(--line)}
.ans summary{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;cursor:pointer;list-style:none}
.ans summary::-webkit-details-marker{display:none}
.ans summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ans summary img{width:28px;height:28px;border-radius:50%;background:var(--sunk)}
.ans-name{min-width:0;display:flex;flex-direction:column}
.ans-name b{font-size:14px}
.ans-name small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ans[open] .ans-name small{display:none}
.ans-score{font-size:16px;color:var(--amber)}
.ans-grid{display:grid;grid-template-columns:92px 1fr;gap:8px 12px;margin:0 0 14px;font-size:14px}
.ans-grid dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.ans-grid dd{margin:0;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;overflow-wrap:anywhere}
.dots{display:inline-flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--sunk);border:1px solid var(--line)}
.dots i.on{background:var(--amber);border-color:var(--amber)}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line);margin-right:4px;vertical-align:-2px}
.cmp-wrap{overflow-x:auto;margin:0 0 14px}
.cmp-table{width:100%;border-collapse:collapse;font-size:14px}
.cmp-table th,.cmp-table td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.cmp-table thead th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.cmp-table tbody th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;width:1%}
.cmp-table td:last-child{width:1%;text-align:center}
.mk{font-weight:700;font-size:15px}
.mk.ok{color:var(--hop)} .mk.near{color:var(--amber)} .mk.no{color:var(--danger)}
.cmp{display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:start;padding:3px 0}
.cmp-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:5px}
.cmp .chip{cursor:default;padding:3px 9px;font-size:12px}

.h-tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);min-width:0}
.h-tile .ms{color:var(--muted);font-size:22px;width:22px;height:22px}
.h-tile small{font:500 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.h-tile b{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
button.h-tile{appearance:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}.h-tile.h-can{border:2px solid var(--amber);background:var(--amber);color:#fff}.h-tile.h-can small,.h-tile.h-can .ms{color:#fff;opacity:.9}.h-tile.h-can b{color:#fff}.h-go{margin-top:4px;font-size:12px;font-weight:600;color:#fff}.h-tile.h-can:active{transform:scale(.98)}
.h-tile.on{border-color:var(--amber);background:var(--amber-soft)}.h-tile.on .ms{color:var(--amber)}
.h-next{display:flex;flex-direction:column;gap:12px}.h-next h3{margin:0}
.h-todo{appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--amber);background:var(--amber-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;cursor:pointer;font:inherit}
.h-todo span:nth-child(2){flex:1;display:flex;flex-direction:column}.h-todo small{color:var(--muted)}.h-todo .ms{color:var(--amber)}
.grp-list{display:flex;flex-direction:column;gap:8px}
.grp{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.grp>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;cursor:pointer;font:800 17px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:4px;transition:transform .15s}
.grp[open]>summary::after{transform:rotate(-135deg)}
.grp-name{flex:1}
.grp-n{min-width:26px;text-align:center;padding:2px 8px;border-radius:999px;background:var(--amber);color:var(--surface);font:600 13px var(--f-mono)}
.grp>.list{padding:0 10px 10px}
.gp-fig{margin:8px 0;display:flex;gap:10px;align-items:center}.gp-fig img{width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumb.gphoto{object-fit:cover}
.loc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px dashed var(--line);border-radius:var(--r);margin:6px 0}.loc-row .ms{color:var(--amber);font-size:20px;width:20px;height:20px}.loc-row>span:nth-child(2){flex:1;min-width:0}
.loc-form{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}.loc-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.cal-alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--amber-soft);border:1px solid var(--amber);margin-top:8px}.cal-alert .ms{color:var(--amber)}.cal-alert span:nth-child(2){display:flex;flex-direction:column}.cal-alert small{color:var(--muted)}
.mode-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px dashed var(--line);border-radius:var(--r);margin:6px 0}.mode-row .ms{color:var(--amber);font-size:20px;width:20px;height:20px}.mode-row>span:nth-child(2){flex:1;min-width:150px;display:flex;flex-direction:column}.mode-row small{color:var(--muted);font-size:12px}
.reveal-box{border:1px solid var(--amber);background:var(--amber-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.blind-num{font:800 44px var(--f-display)!important;color:var(--amber)!important}
.tab-help{align-self:flex-end;appearance:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--amber);border-radius:999px;padding:5px 12px 5px 8px;font:600 12px var(--f-body);cursor:pointer;margin-bottom:-8px}.tab-help .ms{font-size:18px;width:18px;height:18px}
.mg-list{display:flex;flex-direction:column;gap:6px}.mg-item{appearance:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.mg-item.on{border-color:var(--amber);background:var(--amber-soft);cursor:default}.mg-item span:nth-child(2){flex:1;display:flex;flex-direction:column;min-width:0}.mg-item small{color:var(--muted);font-size:12px}.mg-arr{color:var(--amber);font-weight:600;font-size:13px}
.mg-code{font-size:16px;letter-spacing:.12em}.mg-req{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.mg-head{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--amber);padding-bottom:4px}.mg-head h3{margin:0}
.mg-res>summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;cursor:pointer}.mg-res>summary::-webkit-details-marker{display:none}.mg-res>summary h3{margin:0}.mg-av{margin:8px 0;padding-left:18px;font-size:13px}
.mg-tags{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.mg-tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--amber-soft);color:var(--ink)}
.cal-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}.cal-btns .btn .ms{font-size:18px;width:18px;height:18px;vertical-align:-3px}
.mm{margin:8px 0 6px}
.mini-map{position:relative;width:100%;aspect-ratio:1.35/1;max-height:340px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sea)}
.mini-map svg{display:block;width:100%;height:100%}
.mini-map text{font:600 11px var(--f-body);fill:var(--muted);pointer-events:none}
.mini-map text.halo{stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;fill:none}
.mini-map .mm-land text{font:800 15px var(--f-display);letter-spacing:.06em;text-transform:uppercase;fill:var(--ink)}
.mini-map .mm-tl text{font:700 13px var(--f-body);fill:var(--ink)}
.mini-map .mm-nb text{font-size:10px;font-style:italic}
.mm figcaption{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:13px;color:var(--ink)}
.mm-key{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:11px;color:var(--muted)}
.mm-key i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-left:6px}
.mm-key i:first-child{margin-left:0}
.k-land{background:var(--amber);border:1px solid var(--ink)}.k-town{background:var(--ink);border-radius:50%!important;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ink)}.k-box{border:1.5px solid var(--danger)}
.mm-nomap .mm-key{display:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast button{appearance:none;background:var(--amber);color:var(--surface);border:0;border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
@media (max-width:480px){
  .fields{grid-template-columns:1fr}
  .swatches{grid-template-columns:repeat(3,1fr)}
  .big-name{font-size:32px}
  .bar{grid-template-columns:80px 1fr 36px}
}
/* donker: rustige vlakken */@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .h-tile.h-can{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}:root:not([data-theme="light"]) .h-tile.h-can b{color:var(--ink)}:root:not([data-theme="light"]) .h-tile.h-can small,:root:not([data-theme="light"]) .h-tile.h-can .ms{color:var(--amber);opacity:1}:root:not([data-theme="light"]) .mode-btn[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}}:root[data-theme="dark"] .h-tile.h-can{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}:root[data-theme="dark"] .h-tile.h-can b{color:var(--ink)}:root[data-theme="dark"] .h-tile.h-can small,:root[data-theme="dark"] .h-tile.h-can .ms{color:var(--amber);opacity:1}:root[data-theme="dark"] .mode-btn[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}</style>

function beerLabels(c){const n=String(c.naam||"").toLowerCase(),sk=styleKey(c.stijl),L=[],seen=new Set();
  const add=(l,t)=>{if(!seen.has(l)){seen.add(l);L.push([l,t])}};
  (Array.isArray(c.labels)?c.labels:(catMatch(c)||{}).labels||[]).forEach(l=>{if(LABEL_INFO[l])add(l,LABEL_INFO[l])});
  if(/gran reserva/.test(n))add("Gran Reserva",LABEL_INFO["Gran Reserva"]);else if(/\breserva\b/.test(n)&&["Tempranillo","Portugees rood"].includes(sk))add("Reserva","Spanje: minimaal drie jaar gerijpt, waarvan een deel op vat");
  else if(/\bcrianza\b/.test(n))add("Crianza","Spanje: minimaal twee jaar gerijpt, waarvan minstens een half jaar op vat");
  if(/\briserva\b/.test(n))add("Riserva","Italië: langer gerijpt dan de gewone versie");
  if(/vieilles vignes|old vines?|vinhas velhas|cepas viejas|vecchie vigne/.test(n))add("Oude stokken","Van oude wijnstokken: minder druiven, meer concentratie");
  if(/brut nature|extra brut/.test(n))add("Zonder suiker","Brut nature of extra brut: (bijna) geen suiker toegevoegd");
  if(/blanc de blancs/.test(n))add("Blanc de blancs","Alleen van witte druiven, meestal chardonnay");
  if(/blanc de noirs/.test(n))add("Blanc de noirs","Witte wijn van blauwe druiven");
  const a=+c.abv||0;if(a>=15&&!["Port","Sherry","Madeira & Marsala","Vin doux & passito"].includes(sk))add("Krachtig","Vanaf 15% alcohol: rustig aan");else if(a&&a<=8)add("Licht","Weinig alcohol ("+String(c.abv).replace(".",",")+"%)");
  return L}

function beerInfo(c){

  const dots=v=>`<span class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=v?"on":""}"></i>`).join("")}</span>`;
  const row=(l,v)=>v?`<dt>${l}</dt><dd>${v}</dd>`:"";
  const tp=tipsFor(c),pl=placeOf(c),iso=isoOf(c.land),gp=groupPhoto(c);
  const dr=Array.isArray(c.druiven)&&c.druiven.length?c.druiven:((catMatch(c)||{}).druiven||[]);
  const km=pl?kmFromAms(pl[0],pl[1]):0,regTxt=pl&&pl[2]&&pl[2]!==c.plaats?((["Nederland","België"].includes(c.land)?"provincie ":"")+pl[2]):"";
  const cap=pl?`<b>${esc(c.plaats)}</b><span class="mm-dir"></span>${regTxt?` (${esc(regTxt)})`:""}${km>15?` · ± ${km.toLocaleString(LOC())} km hemelsbreed van Amsterdam`:km?" · vlak bij Amsterdam":""}`:`<b>${esc(c.land||"")}</b>${c.plaats?` · ${esc(c.plaats)}`:""}`;
  return `${gp?`<figure class="gp-fig"><img src="${esc(gp)}" alt="Jullie foto van ${esc(c.naam)}"><figcaption class="note">Jullie eigen foto, gemaakt bij het scannen</figcaption></figure>`:""}${iso?`<figure class="mm"><div class="mini-map" data-iso="${iso}" data-land="${esc(c.land||"")}"${pl?` data-lat="${pl[0]}" data-lon="${pl[1]}" data-town="${esc(c.plaats)}"`:""} role="img" aria-label="Kaart van ${esc(c.land)}${pl?` met ${esc(c.plaats)}`:""}"></div>
    <figcaption><span class="mm-key"><i class="k-land"></i>${esc(c.land||"")}${pl?`<i class="k-town"></i>wijngebied`:""}<i class="k-box"></i>ligging in de wereld</span><span class="mm-cap">${cap}</span></figcaption></figure>`:""}<dl class="info-grid">
    ${row("Wijnhuis",esc(c.brouwerij||""))}${row("Herkomst",esc([c.plaats,regTxt,c.land].filter(Boolean).join(" · ")))}

    ${(()=>{const pr=priceFor(c),ck=(S.prices||{})[slug(c.naam+"-"+(c.brouwerij||""))];
      const est=`${euro(pr.lo)} – ${euro(pr.hi)} <span class="muted">per ${esc(pr.per)} · indicatief</span>`;
      return row("Prijs",ck?`<b>${euro(ck.prijs)}</b> <span class="muted">${ck.inhoud?"per "+esc(ck.inhoud)+" · ":""}${ck.url?`<a href="${esc(ck.url)}" target="_blank" rel="noopener">${esc(ck.winkel||"winkel")}</a>`:esc(ck.winkel)}</span><br><small class="muted">Gecontroleerd op ${fmtDate(ck.at)} · normaal ${euro(pr.lo)} – ${euro(pr.hi)}</small>`
        :`<b>${est}</b>${pr.note?`<br><small class="muted">${esc(pr.note)}</small>`:""}`)})()}
    ${row("Lekker bij",esc(pairFor(c.stijl)))}

    ${row("Wijnmaken",esc(tp.gisting))}${row("Schenktip",esc(tp.schenk))}${row("Bewaren",esc(tp.bewaar))}${row("Weetje",esc(tp.weet))}
    ${tried?`${col?row("Kleur",`<i class="sw" style="background:${col.c}"></i>${col.n} <span class="muted">${esc(col.ebc)}</span>`):""}
    ${ref?row("Helderheid",esc(ref.helderheid)):""}
    ${ref?DIMS.map(([dk,l])=>row(l,dots(ref[dk]))).join(""):""}`:(ref?row("Kleur en profiel",`<span class="muted">Verborgen tot je deze wijn geproefd hebt</span>`):"")}
    ${row("Aroma's",tried?`<span class="chips">${(c.smaken||[]).map(t=>`<span class="chip" style="cursor:default;padding:2px 8px;font-size:11px">${esc(t)}</span>`).join("")}</span>`:`<span class="muted">Verborgen tot je deze wijn geproefd hebt</span>`)}
    ${row("Bij jullie",n?`${n}× geproefd${sc?` · groepscijfer ${fmt(sc.avg)}`:""}`:`<span class="muted">Nog niet geproefd</span>`)}
    ${c.extraId?row("Bron",c.bron==="claude"?`Toegevoegd door Claude${c.bronUrl?` · <a href="${esc(c.bronUrl)}" target="_blank" rel="noopener">bron</a>`:""}`:`Toegevoegd door ${nameSpan(c.by)}`):""}
  </dl><p class="note">${tried?"Kleur, helderheid en profiel zijn typisch voor de stijl; alcoholpercentages zijn indicatief en verschillen per jaargang. Prijzen zijn een schatting van gangbare winkelprijzen in Nederland, tenzij er gecontroleerd bij staat.":"Kleur, profiel en aroma's zie je na het proeven, zodat je eerlijk blind proeft. Alcoholpercentages zijn indicatief en verschillen per jaargang. Prijzen zijn een schatting van gangbare winkelprijzen in Nederland, tenzij er gecontroleerd bij staat."}</p>`;
}
function thumbHtml(src,name,cls="",stijl){return src?`<img class="thumb ${cls}" src="${esc(src)}" alt="">`:`<div class="thumb ph glassbox ${cls}">${glassSvg(stijl)}</div>`}

/* "Door jou geproefd" gegroepeerd per wijnstijl, met aantallen */
function doneGroups(done,row){
  const g={};done.forEach(t=>{const bs=t.masked?"":mergeBeer({naam:t.naam,brouwerij:t.brouwerij,...beerOf(t)}).stijl,st=t.masked?"Blind · nog geheim":styleKey(bs)||bs||"Overig";(g[st]=g[st]||[]).push(t)});
  const ks=Object.keys(g).sort((a,b)=>g[b].length-g[a].length||a.localeCompare(b,"nl"));if(!S.grpOpen)S.grpOpen={};
  return `<div class="grp-list">${ks.map(k=>`<details class="grp" data-grp="${esc(k)}"${S.grpOpen[k]?" open":""}><summary><span class="grp-name">${esc(k)}</span><span class="grp-n mono">${g[k].length}</span></summary><div class="list">${g[k].sort((a,b)=>(b.at||0)-(a.at||0)).map(row).join("")}</div></details>`).join("")}</div>`}
const mergeBeer=b=>{const c=catMatch(b)||{},o={...c};Object.keys(b||{}).forEach(k=>{if(b[k]!==""&&b[k]!=null&&!(Array.isArray(b[k])&&!b[k].length))o[k]=b[k]});return o};
function viewFeed(){
  if(!S.ready)return `<div class="empty"><div class="spin"></div><p class="muted">Proeverijen laden…</p></div>`;
  if(!S.db)return `<div class="empty"><h2>Groepsopslag niet beschikbaar</h2><p class="muted">Open deze pagina ingelogd bij claude.ai om proeverijen te delen met je groep.</p></div>`;
  if(!S.tastings.length)return `<div class="empty"><h2>Nog geen proeverijen</h2><p class="muted">Maak een foto van een fles of glas. De wijn en de herkomst worden herkend en de vragenlijst gaat naar iedereen in de groep.</p><button class="btn amber" data-go="scan">Eerste wijn scannen</button></div>`;
  const todo=S.tastings.filter(t=>!myAnswer(t.id)), done=S.tastings.filter(t=>myAnswer(t.id));
  const gr=globalRanking();
  const row=t=>{const n=answersFor(t.id).length,a=myAnswer(t.id);
    return `<button class="row-btn" data-open="${esc(t.id)}">${thumbHtml(t.thumb,t.naam,"",beerOf(t).stijl)}<div class="row-main"><b>${esc(t.naam)}</b><span>${esc(origin(t))}</span><br><span>Gestart door ${nameSpan(t.by)} · ${n} ${n===1?"proever":"proevers"}</span></div>${a?`<span class="pill done">${fmt(a.score)}</span>`:`<span class="pill todo">Invullen</span>`}</button>`};
  const toRev=(S.tRaw||[]).filter(canReveal);const revDays=[...new Set(toRev.map(x=>avondKey(x.at)))];
  const revBox=toRev.length?`<div class="reveal-box"><p><b>Blind proeven:</b> ${toRev.length} ${toRev.length===1?"wijn is":"wijnen zijn"} nog geheim voor de anderen (${toRev.map(x=>"Wijn "+(x.nr||"?")+(x.by===S.me?" = "+esc(x.naam):" van "+who(x.by))).join(", ")}).</p><div class="next-act">${revDays.map(d=>`<button class="btn amber small" data-reveal-all="${d}">${revDays.length>1?"Onthul "+esc(avondLabel(d)):"Alle wijnen onthullen"}</button>`).join("")}</div></div>`:"";
  return `${revBox}${todo.length?`<section><h3>Wacht op jouw vragenlijst</h3><div class="list">${todo.map(row).join("")}</div></section>`:""}
  ${done.length?`<section><h3>Door jou geproefd <span class="muted mono" style="font-size:13px">${done.length}</span></h3>${doneGroups(done,row)}</section>`:""}`;
}

      <p class="note">Iedereen in de groep ziet de proeverij verschijnen. Wie de pagina open heeft krijgt meteen een melding.</p></div>`;
  }
  if(!b&&sc.status==="idle"&&!S.sample)out+=`<button class="linkbtn" id="manual">Geen foto? Vul de wijn zelf in</button>`;

}

    <label>Land<select id="c-land"><option value="">Alle landen (${landTot})</option>${landen.map(x=>`<option value="${esc(x)}"${x===fl?" selected":""}>${esc(x)} (${landN[x]||0})</option>`).join("")}</select></label></div></div>
  <div class="chips">${grp?`<button type="button" class="chip" aria-pressed="true" id="clear-group">Thema: ${esc(grp[0])} ✕</button>`:""}${S.catExtra.length?`<button type="button" class="chip" id="c-new" aria-pressed="${!!S.cNew}">Nieuw toegevoegd (${S.catExtra.length})</button>`:""}</div>
  <p class="note">${rows.length} ${rows.length===1?"wijn":"wijnen"}${fs||fl||q||grp?" gevonden":""}. Alcoholpercentages zijn indicatief.</p>
  <div class="list">${shown.map(c=>{const k=slug(c.naam+"-"+c.brouwerij),had=!!S.beers[k],n=S.tastings.filter(t=>t.beerKey===k).length,tried=triedBeer(k);
    return `<div class="beer-row cat g"><div class="thumb ph glassbox">${glassSvg(c.stijl)}</div><div class="row-main"><b>${esc(c.naam)}</b><span>${esc(origin(c))}</span>
      <div class="when mono" style="color:var(--muted)">${esc([c.stijl,(c.druiven||[]).length&&!(c.druiven.length===1&&c.druiven[0]===c.stijl)?c.druiven.join(", "):"",c.abv?String(c.abv).replace(".",",")+"%":""].filter(Boolean).join(" · "))} ${tempTag(c.stijl)}</div>${pairLine(c.stijl)}
      ${c.extraId?`<span class="added">${c.bron==="claude"?`Nieuw · toegevoegd door Claude op ${fmtDate(c.at)}${c.bronUrl?` · <a href="${esc(c.bronUrl)}" target="_blank" rel="noopener">bron</a>`:""}`:`Toegevoegd door ${nameSpan(c.by)}`}${c.by===S.me?` · <button class="linkbtn" data-delx="${esc(c.extraId)}">verwijderen</button>`:""}</span>`:""}
      ${tried?`<div class="chips" style="margin-top:6px">${(c.smaken||[]).map(t=>`<span class="chip" style="cursor:default;padding:3px 9px;font-size:12px">${esc(t)}</span>`).join("")}</div>`:""}</div>
      <div class="cat-act">${had?`<span class="pill done">Gehad · ${n}×</span>`:""}<button class="btn ghost small" data-cat="${c.i}" ${S.canWrite&&S.db?"":"disabled"}>${had?"Nog eens proeven":"Proeverij starten"}</button></div><div class="act-toggles wide"><details class="buy-more"><summary class="linkbtn">Waar te koop</summary><div class="buys compact">${buyLinks(c)}</div></details><details class="buy-more info-more"><summary class="linkbtn">Over deze wijn</summary>${beerInfo(c)}</details></div></div>`}).join("")}</div>

const splitGrapes=s=>String(s||"").split(/[,;+\/]| en /).map(x=>x.trim()).filter(Boolean).slice(0,6).map(x=>x.slice(0,40));
function bindAddForm(f){
  const d=S.addDraft, ids=["naam","brouwerij","plaats","land","stijl","druiven","abv","prijs"];
  const read=()=>ids.forEach(k=>{d[k]=$("#a-"+k).value.trim()});
  ids.forEach(k=>$("#a-"+k).addEventListener("input",read));
  $("#a-smaken").addEventListener("click",e=>{const b=e.target.closest("[data-val]");if(!b)return;const v=b.dataset.val,i=d.smaken.indexOf(v);i<0?d.smaken.push(v):d.smaken.splice(i,1);b.setAttribute("aria-pressed",i<0)});
  $("#a-cancel").onclick=()=>{S.addBeer=false;S.addDraft=null;render()};
  const fb=$("#a-fill"); if(fb)fb.onclick=async()=>{read();const er=$("#a-err");er.hidden=true;
    if(!d.naam){er.hidden=false;er.textContent="Vul eerst de naam van de wijn in.";return}
    fb.disabled=true;fb.textContent="Bezig…";
    try{const r=await S.sampleText.json(`Je bent een wijnkenner. Geef informatie over deze wijn: naam "${d.naam}"${d.brouwerij?`, wijnhuis "${d.brouwerij}"`:""}.
Geef ALLEEN JSON: {"bekend":true,"brouwerij":"","plaats":"","land":"","stijl":"","druiven":[],"abv":"","prijs":0,"smaken":[]}
- brouwerij: naam van het wijnhuis. plaats: de wijnstreek of appellation (bijv. "Pauillac", "Rioja", "Marlborough"). land in het Nederlands.
- stijl: kies uit: ${STYLE_NAMES.join(", ")}.
- druiven: de druivenrassen. abv als getal in tekst, bijv. "13.5", of "" als onbekend.
- prijs: gangbare winkelprijs per fles in euro in Nederland (getal), of 0 als je het niet weet.
- smaken: 3 tot 6 termen, alleen uit deze lijst: ${TAGS.join(", ")}.
- Ken je deze wijn niet, geef dan {"bekend":false}. Verzin niets.`,{modelTier:"default"});
      if(!r||r.bekend===false){$("#a-fill-note").textContent="Claude kent deze wijn niet. Vul de velden zelf in."}
      else{["brouwerij","plaats","land","stijl","abv"].forEach(k=>{if(!d[k]&&r[k])d[k]=String(r[k]).replace(",",".").slice(0,k==="abv"?6:80)});

    }catch(e){$("#a-fill-note").textContent=e?.code==="rate_limited"?"Even te veel verzoeken. Probeer het zo opnieuw.":e?.code==="not_granted"?"Aanvullen is niet toegestaan.":"Aanvullen lukte niet."}
    fb.disabled=false;fb.textContent="Aanvullen met Claude"};
  f.onsubmit=async e=>{e.preventDefault();read();const er=$("#a-err");er.hidden=true;
    if(!d.naam){er.hidden=false;er.textContent="Vul de naam van de wijn in.";return}
    const key=slug(d.naam+"-"+d.brouwerij);

      S.catExtra.push({...d,druiven:dr,prijs:pr,abv:d.abv.replace(",","."),by:S.me,extraId:key});mergeCat();
      S.addBeer=false;S.addDraft=null;S.cq=d.naam;render();toast("Wijn toegevoegd aan de catalogus")}

  ["Spaans & Portugees",["Tempranillo","Portugees rood"]],
  ["Malbec & Nieuwe Wereld",["Malbec","Zinfandel & Primitivo","Pinotage"]],
  ["Frisse witte",["Sauvignon Blanc","Grüner Veltliner","Albariño","Verdejo","Pinot Grigio & Gris"]],
  ["Chardonnay",["Chardonnay (houtgerijpt)","Chardonnay (fris)"]],
  ["Aromatisch wit",["Riesling","Gewürztraminer","Viognier","Chenin Blanc"]],

  ["Ontdekkingen",["Overig rood","Overig wit"]]];
const groupOf=name=>GROUPS.find(g=>g[0]===name);
/* thema = stijlgroep en/of land */
const themeName=t=>t?[t.stijl,t.land?(t.stijl?"uit "+t.land:t.land):""].filter(Boolean).join(" "):"";
const inGroup=(c,stijl)=>{const g=groupOf(stijl||"");return !g||g[1].includes(styleKey(c.stijl))};
function landItems(stijl){const c={};S.catalog.forEach(b=>{if(b.land&&inGroup(b,stijl))c[b.land]=(c[b.land]||0)+1});
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([l])=>l)}
function wheelItems(){
  if((S.wheelType||"stijl")==="land"){const st=S.next?.stijl&&!S.next?.land?S.next.stijl:"";let l=landItems(st);if(l.length<2)l=landItems("");return l}
  return GROUPS.map(g=>g[0]);
}
function themeCount(t){if(!t)return 0;return S.catalog.filter(c=>inGroup(c,t.stijl)&&(!t.land||c.land===t.land)).length}
const fmtWhen=iso=>{const d=new Date(iso);return isNaN(d)?iso:d.toLocaleString(LOC(),{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})};
function votesFor(iso){const r={ja:[],misschien:[],nee:[]};Object.entries(S.votes).forEach(([uid,v])=>{if(v.round!==S.next?.at)return;const k=v.keuzes?.[iso];if(r[k])r[k].push(uid)});return r}
function myVote(iso){const v=S.votes[S.me];return v&&v.round===S.next?.at?v.keuzes?.[iso]||"":""}
function plannerHtml(){
  const t=S.next, can=S.canWrite&&S.db&&S.me;
  if(t.datum){const v=votesFor(t.datum),d=new Date(t.datum),days=Math.ceil((d-Date.now())/864e5);
    return `<div class="planner fixed"><div class="when-big">${esc(fmtWhen(t.datum))}</div>
      <p class="note">${days>1?`Nog ${days} dagen`:days===1?"Morgen!":days===0?"Vandaag!":"Geweest"}${v.ja.length?` · komen: ${v.ja.map(u=>`<b class="inline">${who(u)}</b>`).join(", ")}`:""}${v.misschien.length?` · misschien: ${v.misschien.length}`:""}</p>
      ${calButtons(t,true)}
      ${can?`<button class="linkbtn" data-unfix>Datum wijzigen</button>`:""}</div>`}
  const ds=(t.datums||[]).slice().sort();
  const scored=ds.map(iso=>{const v=votesFor(iso);return {iso,v,score:v.ja.length*2+v.misschien.length}});
  const best=scored.filter(x=>x.score>0).sort((a,b)=>b.score-a.score)[0];
  return `<div class="planner"><h3>Datum plannen</h3>
    ${ds.length?`<div class="dates">${scored.map(x=>{const mv=myVote(x.iso);return `<div class="date-row${best&&best.iso===x.iso?" best":""}">

  const st=spinState();S.forceIdxUsed=S.forceIdx;S.forceIdx=null;if(!S.demo&&((S.wheelType||"stijl")==="stijl"?!st.canStyle:!st.landStep))return;
  if(S.spinning||S.spinResult)return;const items=wheelItems(),n=items.length;if(!n)return;
  const idx=S.forceIdxUsed!=null&&S.forceIdxUsed>=0&&S.forceIdxUsed<n?S.forceIdxUsed:Math.floor(Math.random()*n),a=2*Math.PI/n,jit=(Math.random()-.5)*a*.6;
  const start=S.wheelRot||0;let target=-(idx+.5)*a+jit;const turns=6;
  target=start-(((start-target)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)-turns*2*Math.PI;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches,dur=reduce?600:4200,t0=performance.now();
  S.spinning=true;S.spinResult=null;render();
  const step=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);S.wheelRot=start+(target-start)*e;drawWheel(S.wheelRot);
    if(p<1)requestAnimationFrame(step);else{S.spinning=false;S.spinResult=items[idx];saveSpin(items[idx])}};
  requestAnimationFrame(step);

/* ---------- raad de wijn ---------- */
const RAAD_LANDEN=["Frankrijk","Italië","Spanje","Portugal","Duitsland","Oostenrijk","Verenigde Staten","Argentinië","Chili","Australië","Nieuw-Zeeland","Zuid-Afrika","Anders"];
const RAAD_DRUIVEN=["Cabernet Sauvignon","Merlot","Pinot Noir","Syrah","Grenache","Tempranillo","Sangiovese","Nebbiolo","Malbec","Gamay","Zinfandel","Chardonnay","Sauvignon Blanc","Riesling","Chenin Blanc","Pinot Grigio","Gewürztraminer","Viognier","Albariño","Glera","Andere druif"];
const GRAPE_ALIAS={"shiraz":"syrah","garnacha":"grenache","garnacha tinta":"grenache","cannonau":"grenache","tinta de toro":"tempranillo","tinto fino":"tempranillo","tinta roriz":"tempranillo","aragonez":"tempranillo","pinot grigio":"pinot gris","grauburgunder":"pinot gris","primitivo":"zinfandel","nielluccio":"sangiovese","chiavennasca":"nebbiolo","spätburgunder":"pinot noir","spatburgunder":"pinot noir","alvarinho":"albariño","albarino":"albariño","gewurztraminer":"gewürztraminer","moscato":"muscat","moscatel":"muscat"};
const gCanon=x=>{const n=String(x||"").toLowerCase().trim();return GRAPE_ALIAS[n]||n};
const RAAD_KNOWN=RAAD_DRUIVEN.map(gCanon);
function raadTruth(tid){
  const raw=(S.tRaw||S.tastings).find(x=>x.id===tid);if(!raw)return null;
  const b=(S.bRaw||S.beers||{})[raw.beerKey]||{},cm=catMatch({naam:raw.naam,brouwerij:raw.brouwerij})||{};
  const names=(Array.isArray(b.druiven)&&b.druiven.length?b.druiven:cm.druiven||[]).map(String);
  return {raw,land:raw.land||b.land||cm.land||"",names,druiven:names.map(gCanon),rol:raw.duel&&raw.duel.rol||"",prijs:+b.prijs||+cm.prijs||0,naam:raw.naam||""};
}
function raadScore(a){
  if(!a||!(a.raadLand||a.raadDruif||a.duelGok))return null;
  const t=S.tastings.find(x=>x.id===a.tid);if(!t||t.masked)return null;
  const tr=raadTruth(a.tid);if(!tr)return null;const list=[];
  if(a.raadLand&&tr.land)list.push({label:"Land",mine:a.raadLand,juist:tr.land,ok:a.raadLand==="Anders"?!RAAD_LANDEN.includes(tr.land):a.raadLand===tr.land});
  if(a.raadDruif&&tr.druiven.length)list.push({label:"Druif",mine:a.raadDruif,juist:tr.names.slice(0,3).join(", "),ok:a.raadDruif==="Andere druif"?!RAAD_KNOWN.includes(tr.druiven[0]):tr.druiven.slice(0,2).includes(gCanon(a.raadDruif))});
  if(a.duelGok&&tr.rol){const L=k=>k==="duur"?"De dure fles":"De goedkope fles";list.push({label:"Duur of goedkoop",mine:L(a.duelGok),juist:L(tr.rol),ok:a.duelGok===tr.rol})}
  return list.length?{list,good:list.filter(x=>x.ok).length,tot:list.length}:null;
}
function closeness(a,described){
  const fz=a&&a.id&&S.frozenPA&&S.frozenPA[a.id];if(fz)return {hits:fz.hits,pct:fz.pct};
  const c=aromaCloseness(a,described),r=raadScore(a);if(!r)return c;
  const w=Math.min(.6,.2*r.tot),rp=100*r.good/r.tot;
  return {hits:c?c.hits:0,pct:Math.round(c?c.pct*(1-w)+rp*w:rp)};
}
function raadForm(tq,d){
  if(!tq||(tq.by===S.me&&!tq.onthuld))return "";
  const blind=!!tq.blind,duel=!!tq.duel;if(!blind&&!duel)return "";
  return `<div class="q raad"><div class="q-head"><h3>Raad de wijn</h3><span class="mono">telt mee voor je score</span></div>
    ${blind?`<div class="sub"><label>Uit welk land?</label>${chipGroup("raadLand",RAAD_LANDEN,d.raadLand||"")}</div><div class="sub"><label>Welke (hoofd)druif?</label>${chipGroup("raadDruif",RAAD_DRUIVEN,d.raadDruif||"")}</div>`:""}

    <p class="note">Land, druif en duur of goedkoop tellen elk voor 20% mee in je score.</p></div>`;

function raadPanel(t,as){
  if(t.masked)return "";const tr=raadTruth(t.id);if(!tr)return "";

  if(!rows.length&&!duel)return "";
  return `<div class="panel raad-panel"><h3>${tr.rol?"Duel: duur tegen goedkoop":"Raad de wijn"}</h3>${duel}
    ${rows.length?`<div class="kv"><div><span>Land</span><b>${esc(tr.land||"–")}</b></div><div><span>Druif</span><b>${esc(tr.names.slice(0,3).join(", ")||"–")}</b></div></div>
    <h3 style="margin-top:12px">Gokken van de groep</h3><div class="raad-list">${rows.sort((x,y)=>y.r.good-x.r.good).map(({a,r})=>`<div class="raad-row"><b>${who(a.uid)}</b><div class="chips">${r.list.map(x=>`<span class="chip ${x.ok?"match":"miss"}" style="cursor:default">${x.ok?"✓":"✗"} ${esc(x.mine)}</span>`).join("")}</div></div>`).join("")}</div>`:""}
  </div>`;

/* ---------- duel: duur tegen goedkoop ---------- */
function duelPairs(){
  const th=S.next||{},key=S.catalog.length+"|"+(th.stijl||"")+"|"+(th.land||"");
  if(S._dpKey===key&&S._dp)return S._dp;
  const mk=C=>{const by={};C.filter(c=>c.prijs>0&&c.kleur&&c.regio).forEach(c=>{const k=c.land+"|"+c.regio+"|"+c.kleur+"|"+styleKey(c.stijl);(by[k]=by[k]||[]).push(c)});
    const out=[];Object.values(by).forEach(g=>{const ch=g.filter(c=>c.prijs<=15),de=g.filter(c=>c.prijs>=25&&c.prijs<=250);ch.forEach(a=>de.forEach(b=>{if(b.prijs>=3*a.prijs)out.push([a,b])}))});return out};
  let P=th.stijl||th.land?mk(S.catalog.filter(c=>inGroup(c,th.stijl)&&(!th.land||c.land===th.land))):[];
  S._dpTheme=P.length>0;if(!P.length)P=mk(S.catalog);
  for(let i=P.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[P[i],P[j]]=[P[j],P[i]]}
  S._dp=P;S._dpKey=key;S.duelIdx=0;return P;
}
function duelPanel(){
  const P=duelPairs();if(!P.length)return "";const [g,d]=P[(S.duelIdx||0)%P.length];
  return `<details class="panel duel" id="duel-box"${S.duelOpen?" open":""}><summary><b>Duel: duur tegen goedkoop</b><span class="note">Twee wijnen uit dezelfde streek, blind geproefd. Wie proeft welke de dure is?</span></summary>
    ${S._dpTheme&&S.next&&S.next.naam?`<p class="note">Past bij het thema <b>${esc(S.next.naam)}</b></p>`:""}
    <div class="duel-pair">${[["Goedkoop",g],["Duur",d]].map(([l,c])=>`<div class="duel-row"><span class="duel-lbl">${l}</span><div class="row-main"><b>${esc(c.naam)}</b><span>${esc(origin(c))}</span></div><span class="mono duel-prijs">${euro(c.prijs)}</span></div>`).join("")}</div>
    <p class="note">Je ziet zelf welke wijn welke is; de rest van de groep proeft blind. Na het onthullen zie je wie het goed had en welke fles de groep lekkerder vond.</p>
    <div class="next-act"><button type="button" class="btn ghost small" data-duel-next>Ander duo</button>${S.canWrite&&S.db&&S.me?`<button type="button" class="btn amber small" data-duel-start>Start duel</button>`:""}</div></details>`;
}
function duels(ts){
  const m={};ts.forEach(t=>{if(t.duel&&t.duel.id&&!t.masked)(m[t.duel.id]=m[t.duel.id]||{})[t.duel.rol]=t});
  return Object.values(m).filter(d=>d.duur&&d.goedkoop).map(d=>{
    const ad=answersFor(d.duur.id),ag=answersFor(d.goedkoop.id),per={};
    [...ad,...ag].filter(a=>a.duelGok).forEach(a=>{(per[a.uid]=per[a.uid]||[]).push(a.duelGok===(a.tid===d.duur.id?"duur":"goedkoop"))});
    const v=Object.values(per);
    return {...d,pd:raadTruth(d.duur.id)?.prijs||0,pg:raadTruth(d.goedkoop.id)?.prijs||0,sd:avg(ad,"score"),sg:avg(ag,"score"),n:v.length,ok:v.filter(x=>x.every(Boolean)).length};
  });
}
function duelHtml(ts){
  return duels(ts).map(d=>`<div class="panel duel"><h3>Duur tegen goedkoop</h3><div class="duel-pair">
    ${[["Duur",d.duur,d.pd,d.sd],["Goedkoop",d.goedkoop,d.pg,d.sg]].map(([l,t,p,s])=>`<button class="duel-row row-btn" data-open="${esc(t.id)}"><span class="duel-lbl">${l}</span><div class="row-main"><b>${esc(t.naam)}</b><span>${esc(t.brouwerij||"")}</span></div><span class="mono duel-prijs">${p?euro(p):""}</span>${s?`<span class="pill done">${fmt(s)}</span>`:`<span class="pill todo">Geen cijfer</span>`}</button>`).join("")}</div>
    ${d.sd&&d.sg?`<p class="duel-verdict"><b>${d.sg>d.sd?"De goedkope fles won!":d.sd>d.sg?"De dure fles won.":"Gelijkspel."}</b></p>`:`<p class="note">Nog geen cijfers voor beide wijnen.</p>`}
    ${d.n?`<p class="note">${d.ok} van ${d.n} proevers wisten welke de dure was.</p>`:""}</div>`).join("");
}
function bindDuel(){
  const box=document.getElementById("duel-box");if(box)box.ontoggle=()=>{S.duelOpen=box.open};
  document.querySelectorAll("[data-duel-next]").forEach(b=>b.onclick=()=>{S.duelIdx=(S.duelIdx||0)+1;S.duelOpen=true;render()});
  document.querySelectorAll("[data-duel-start]").forEach(b=>b.onclick=async()=>{
    if(!S.me){toast("Log in bij claude.ai om een proeverij te starten.");return}
    if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Zeker? Tik nogmaals";return}
    const P=duelPairs();if(!P.length)return;const [g,d]=P[(S.duelIdx||0)%P.length];
    b.disabled=true;b.textContent="Versturen…";
    const id="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const order=Math.random()<.5?[["goedkoop",g],["duur",d]]:[["duur",d],["goedkoop",g]];
    try{for(const [rol,c] of order)await createTasting({...c,omschrijving:"",__duel:{id,rol}},"");
      S.tab="feed";S.tid=null;S.duelOpen=false;S.duelIdx=(S.duelIdx||0)+1;render();window.scrollTo(0,0);toast("Duel gestart: twee wijnen staan klaar om blind te proeven")}
    catch(e){b.disabled=false;b.textContent="Start duel";toast("Duel starten mislukt.")}
  });
}

function avg(list,k){const v=list.map(a=>a[k]).filter(x=>typeof x==="number"&&x>0);return v.length?v.reduce((s,x)=>s+x,0)/v.length:0}
function mode(list,k){const c={};list.forEach(a=>{if(a[k])c[a[k]]=(c[a[k]]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||""}

function tasteProfile(mode){

function drawMap(){
  const el=$("#worldmap");if(!el)return;
  if(typeof window.Datamap!=="function"){el.innerHTML='<p class="note">De kaart kon niet laden. De lijst hieronder toont de landen.</p>';el.style.aspectRatio="auto";return}
  const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
  const md=mapData(),max=Math.max(1,...md.map(x=>x.n)),data={};
  md.forEach(x=>{const iso=isoOf(x.land);if(iso)data[iso]={fillKey:x.n>=Math.max(3,max*.66)?"hi":x.n>=2?"mid":"lo",n:x.n,land:x.land}});
  el.innerHTML="";
  const reg=(REGIONS.find(x=>x[0]===(S.region||"wereld"))||REGIONS[0])[2];
  const proj=window.d3?function(element){const w=element.offsetWidth,h=element.offsetHeight;
    const my=lat=>Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
    const pr=reg?(()=>{const [W,Sth,E,N]=reg,yN=my(N),yS=my(Sth),sc=Math.min(w*.94/((E-W)*Math.PI/180),h*.9/(yN-yS));
        return window.d3.geo.mercator().scale(sc).center([(W+E)/2,0]).translate([w/2,h/2+sc*(yN+yS)/2])})()
      :window.d3.geo.equirectangular().scale(Math.min(w/6.5,h/3.3)).translate([w/2,h/2]);
    return {path:window.d3.geo.path().projection(pr),projection:pr}}:undefined;
  try{S.map=new window.Datamap({element:el,scope:"world",responsive:!proj,projection:"mercator",setProjection:proj,
    fills:{defaultFill:g("--sunk"),lo:g("--amber-soft"),mid:"#9E4357",hi:g("--amber")},data,
    geographyConfig:{borderColor:g("--surface"),borderWidth:.6,highlightOnHover:true,highlightFillColor:g("--hop"),highlightBorderColor:g("--surface"),
      popupTemplate:(geo,d)=>`<div class="map-pop"><b>${esc(d?d.land:geo.properties.name)}</b>${d?` · ${d.n} ${d.n===1?"wijn":"wijnen"}`:" · nog niet geproefd"}</div>`}});
  }catch(e){el.innerHTML='<p class="note">De kaart kon niet laden.</p>'}
}
function drawMiniMap(el){
  if(!el||el.dataset.drawn)return;el.dataset.drawn="1";
  const fig=el.closest(".mm"),fail=()=>{el.remove();if(fig)fig.classList.add("mm-nomap")};
  const d3=window.d3,tj=window.topojson,DM=window.Datamap;
  if(!d3||!tj||typeof DM!=="function"||!DM.prototype.worldTopo){fail();return}
  try{
    const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim(),iso=el.dataset.iso;
    const topo=DM.prototype.worldTopo,all=tj.feature(topo,topo.objects.world).features,feat=all.find(f=>f.id===iso);
    if(!feat){fail();return}
    const town=el.dataset.lat?[+el.dataset.lon,+el.dataset.lat]:null;
    /* begrenzing: alleen de grote delen van het land (geen verre eilanden/overzeese gebieden), plus de wijngebied */
    const polys=feat.geometry.type==="MultiPolygon"?feat.geometry.coordinates.map(c=>({type:"Polygon",coordinates:c})):[feat.geometry];

      const dEl=fig&&fig.querySelector(".mm-dir");if(dEl&&(cE-cW)>.6)dEl.textContent=` in ${dir} van ${land}`;
    } else if(land)lbl(cc[0],cc[1]+4,land,"mm-land").selectAll("text").attr("text-anchor","middle");
    /* wereldje rechtsonder: waar ligt het land */
    const iw=Math.round(Math.min(110,w*.3)),ih=Math.round(iw*.55),ix=w-iw-6,iy=h-ih-6;

    ins.append("g").selectAll("path").data(all.filter(f=>f.id!=="ATA")).enter().append("path").attr("d",ipath).attr("fill",f=>f.id===iso?g("--amber"):g("--sunk"));
    const [bx1,by1]=ip([cW,cN]),[bx2,by2]=ip([cE,cS]),bw=Math.max(6,bx2-bx1),bh=Math.max(6,by2-by1);

  }catch(e){console.warn(e);fail()}
}

const pad2=n=>String(n).padStart(2,"0");
function evTimes(t){const [d,tm]=t.datum.split("T"),[y,mo,da]=d.split("-").map(Number),[hh,mi]=tm.split(":").map(Number);
  const st=new Date(y,mo-1,da,hh,mi),en=new Date(st.getTime()+3*36e5),z=x=>x.toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";return {st,en,zs:z(st),ze:z(en)}}

  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Wijnproeverij//NL","CALSCALE:GREGORIAN","METHOD:PUBLISH",...(feed?["X-WR-CALNAME:🍷 Wijnproeverij","X-APPLE-CALENDAR-COLOR:#6E1A2D","COLOR:darkred","X-WR-TIMEZONE:Europe/Amsterdam","REFRESH-INTERVAL;VALUE=DURATION:PT3H","X-PUBLISHED-TTL:PT3H"]:[]),"BEGIN:VEVENT",`UID:wp-${t.at||zs}@proefgroep`,`SEQUENCE:${t.rev||0}`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,
    `DTSTART:${zs}`,"COLOR:darkred",`DTEND:${ze}`,`SUMMARY:${clean("🍷 Wijnproeverij"+(t.blind?" (blind)":"")+": "+themeName(t))}`,`DESCRIPTION:${clean(desc)}`,...(locText(t)?[`LOCATION:${clean(locText(t))}`]:[]),

async function syncAgendaFeed(){
  const t=S.next;if(!S.db||S.demo||!S.canWrite||!S.me||!t)return;

  try{
    const d=await S.db.doc("meta/agenda").get();const cur=d&&d.exists?d.data():null;
    if(cur&&cur.sig===sig){S.feedSig=sig;return}
    await S.db.doc("meta/agenda").set({sig,uid:`wp-${t.at||0}@proefgroep`,ics:t.datum?icsFor(t,true):"",at:Date.now(),by:S.me});
    S.feedSig=sig;
  }catch(e){}
}

function beerConfetti(ms=4200){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)ms=1600;
  const old=document.getElementById("confetti");if(old)old.remove();
  const cv=document.createElement("canvas");cv.id="confetti";cv.setAttribute("aria-hidden","true");
  cv.style.cssText="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60";document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
  const kinds=["glass","glass","glass","grape","grape","bubble","bubble","drop"],N=Math.round(Math.min(170,W*.42));
  const P=Array.from({length:N},(_,i)=>{const k=kinds[i%kinds.length];return {k,x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2.2,vy:2+Math.random()*3.2,r:Math.random()*6.28,vr:(Math.random()-.5)*.14,s:k==="glass"?11+Math.random()*7:k==="grape"?7+Math.random()*4:3+Math.random()*5,sw:Math.random()*6.28,wit:Math.random()<.3}});
  const glass=(s,wit)=>{x.fillStyle=wit?"#E8D27A":"#6E1A2D";x.beginPath();x.moveTo(-s*.45,-s*.15);x.quadraticCurveTo(-s*.45,s*.45,0,s*.45);x.quadraticCurveTo(s*.45,s*.45,s*.45,-s*.15);x.closePath();x.fill();
    x.strokeStyle="rgba(255,255,255,.9)";x.lineWidth=s*.08;x.beginPath();x.moveTo(-s*.5,-s*.55);x.quadraticCurveTo(-s*.55,s*.48,0,s*.5);x.quadraticCurveTo(s*.55,s*.48,s*.5,-s*.55);x.stroke();
    x.beginPath();x.moveTo(0,s*.5);x.lineTo(0,s*1.05);x.moveTo(-s*.3,s*1.08);x.lineTo(s*.3,s*1.08);x.stroke()};
  const grape=s=>{const pts=[[0,-.5],[-.3,-.5],[.3,-.5],[-.15,-.22],[.15,-.22],[-.3,-.22],[.3,-.22],[0,.05],[-.15,.32],[.15,.32],[0,.58]];
    x.fillStyle="#5A1340";pts.forEach(([a,b])=>{x.beginPath();x.arc(a*s,b*s,s*.17,0,6.28);x.fill()});
    x.fillStyle="#6E8F3A";x.beginPath();x.ellipse(s*.2,-s*.78,s*.24,s*.1,-.5,0,6.28);x.fill()};
  const t0=performance.now();
  const step=n=>{const el=n-t0;x.clearRect(0,0,W,H);const fade=el>ms-900?Math.max(0,(ms-el)/900):1;x.globalAlpha=fade;
    for(const p of P){p.sw+=.05;p.x+=p.vx+Math.sin(p.sw)*.8;p.y+=p.vy;p.vy+=p.k==="bubble"?.01:.035;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.k==="bubble"?0:p.r);
      if(p.k==="glass")glass(p.s,p.wit);else if(p.k==="grape")grape(p.s);
      else if(p.k==="bubble"){x.strokeStyle="rgba(217,162,27,.9)";x.lineWidth=1.6;x.beginPath();x.arc(0,0,p.s,0,6.28);x.stroke();x.fillStyle="rgba(255,255,255,.7)";x.beginPath();x.arc(-p.s*.35,-p.s*.35,p.s*.25,0,6.28);x.fill()}
      else{x.fillStyle="#7A1F33";x.beginPath();x.moveTo(0,-p.s*1.2);x.quadraticCurveTo(p.s,0,0,p.s);x.quadraticCurveTo(-p.s,0,0,-p.s*1.2);x.fill()}
      x.restore()}
    el<ms?requestAnimationFrame(step):cv.remove()};
  requestAnimationFrame(step);
}

    const doc={tid,uid:S.me,kleur:d.kleur,helderheid:d.helderheid,schuim:d.schuim,aromaInt:d.aromaInt,aroma:d.aroma,zoet:d.zoet,bitter:d.bitter,zuur:d.zuur,smaak:d.smaak,body:d.body,koolzuur:d.koolzuur,afdronk:d.afdronk,score:d.score,opmerking:d.opmerking,at:Date.now(),...(d.raadLand?{raadLand:d.raadLand}:{}),...(d.raadDruif?{raadDruif:d.raadDruif}:{}),...(d.duelGok?{duelGok:d.duelGok}:{})};

function upsertLocal(arr,obj){const i=arr.findIndex(x=>x.id===obj.id);i<0?arr.push(obj):arr[i]=obj}

/* ---------- photo + recognition ---------- */
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u})}
function toCanvas(img,max){const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function squareThumb(img,size){const c=document.createElement("canvas");c.width=c.height=size;const m=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,size,size);return c.toDataURL("image/jpeg",0.72)}

async function onPhoto(file){
  const sc=S.scan; sc.error=""; sc.beer=null; sc.editing=false;
  let img; try{img=await loadImg(file)}catch(e){sc.error="Deze foto kan niet worden geopend. Probeer een JPG of PNG.";render();return}
  const big=toCanvas(img,1280); sc.preview=big.toDataURL("image/jpeg",0.8); sc.thumb=squareThumb(img,280);
  if(!S.sample){sc.beer={naam:"",brouwerij:"",plaats:"",land:""};sc.editing=true;sc.error="Automatisch herkennen is hier niet beschikbaar. Vul de wijn zelf in.";render();return}
  sc.status="busy"; render();
  const blob=await new Promise(r=>big.toBlob(r,"image/jpeg",0.85));
  const prompt=`Je bent een wijnkenner. De afbeelding is een foto van een wijn (fles, etiket of glas). Herken de wijn.
Geef ALLEEN JSON terug in deze vorm:
{"isWijn":true,"naam":"","brouwerij":"","plaats":"","land":"","stijl":"","druiven":[],"jaargang":"","abv":"","prijs":0,"smaken":[],"omschrijving":""}
Regels:
- naam: de naam van de wijn zoals op het etiket (zonder jaargang). brouwerij: het wijnhuis of de producent. plaats: de wijnstreek of appellation (bijv. "Pauillac", "Rioja", "Marlborough"). land in het Nederlands.
- stijl: kies uit: ${STYLE_NAMES.join(", ")}.
- druiven: de druivenrassen (van het etiket, of wat gebruikelijk is voor deze wijn). jaargang: het jaartal op het etiket of "".
- abv: alcoholpercentage als getal in tekst, bijv. "13.5", of "" als onbekend. prijs: gangbare winkelprijs per fles in euro in Nederland (getal), of 0.
- smaken: 3 tot 6 aroma's die deze wijn typisch beschrijven, UITSLUITEND gekozen uit deze lijst: ${TAGS.join(", ")}.
- omschrijving: 1 of 2 korte zinnen in het Nederlands over geur en smaak.
- Als je de wijn niet zeker weet, vul dan in wat je op het etiket kunt lezen en laat de rest leeg. Verzin geen wijnhuis.
- Als er geen wijn op de foto staat: {"isWijn":false}.`;
  try{
    const r=await S.sample.json(prompt,{images:[blob],modelTier:"default"});
    sc.status="done";
    if(!r||r.isWijn===false){sc.error="Op deze foto is geen wijn herkend. Probeer een scherpere foto van het etiket.";sc.status="idle";render();return}
    const smaken=Array.isArray(r.smaken)?r.smaken.filter(x=>TAGS.includes(x)).slice(0,6):[];
    const druiven=Array.isArray(r.druiven)?r.druiven.filter(x=>typeof x==="string").slice(0,6).map(x=>x.slice(0,40)):[];
    const prijs=typeof r.prijs==="number"&&r.prijs>0&&r.prijs<5000?rnd(r.prijs):0;
    sc.beer={naam:String(r.naam||"").slice(0,120),brouwerij:String(r.brouwerij||"").slice(0,120),plaats:String(r.plaats||"").slice(0,80),land:String(r.land||"").slice(0,60),stijl:String(r.stijl||"").slice(0,60),druiven,prijs,jaargang:/^\d{4}$/.test(String(r.jaargang||""))?String(r.jaargang):"",abv:String(r.abv||"").replace(",",".").slice(0,6),smaken,omschrijving:String(r.omschrijving||"").slice(0,400)};
    if(!sc.beer.naam){sc.editing=true;sc.error="Het etiket was niet goed leesbaar. Vul de naam zelf in."}
  }catch(e){
    sc.status="idle"; sc.beer={naam:"",brouwerij:"",plaats:"",land:""}; sc.editing=true;
    sc.error=e?.code==="not_granted"?"Herkennen is niet toegestaan. Vul de wijn zelf in.":e?.code==="rate_limited"?"Even te veel verzoeken. Wacht een minuut of vul de wijn zelf in.":"Herkennen lukte niet. Vul de wijn zelf in.";
  }
  render();
}

async function createTasting(b,thumb){
  const key=slug(b.naam+"-"+(b.brouwerij||""));
  const ref=S.db.doc("beers/"+key), snap=await ref.get();
  const extra={druiven:Array.isArray(b.druiven)?b.druiven.slice(0,6):[],prijs:+b.prijs>0?+b.prijs:0,labels:Array.isArray(b.labels)?b.labels.slice(0,8):[]};
  if(!snap.exists){await ref.set({naam:b.naam,brouwerij:b.brouwerij||"",plaats:b.plaats||"",land:b.land||"",stijl:b.stijl||"",abv:b.abv||"",smaken:b.smaken||[],omschrijving:b.omschrijving||"",thumb:thumb||"",...extra,by:S.me,at:Date.now()})}
  else if(thumb&&!snap.data().thumb){await ref.update({thumb})}
  const tid="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const t={beerKey:key,naam:b.naam,brouwerij:b.brouwerij||"",plaats:b.plaats||"",land:b.land||"",thumb:thumb||"",by:S.me,at:Date.now()};
  if(b.jaargang)t.jaargang=String(b.jaargang).slice(0,4);
  if(S.next&&S.next.blind&&!S.demo){t.blind=true;t.nr=blindNr()}
  if(b.__duel){t.duel={id:String(b.__duel.id).slice(0,40),rol:b.__duel.rol==="duur"?"duur":"goedkoop"};if(!S.demo&&!t.blind){t.blind=true;t.nr=blindNr()}}
  if(S.next&&S.next.locatie)t.locatie=String(S.next.locatie).slice(0,60);
  await S.db.doc("tastings/"+tid).set(t);
  if(!S.tRaw)S.tRaw=[...S.tastings];upsertLocal(S.tRaw,{id:tid,...t});S.tRaw.sort((a,b)=>(b.at||0)-(a.at||0));
  if(!S.bRaw)S.bRaw={...S.beers};if(!S.bRaw[key])S.bRaw[key]={naam:b.naam,brouwerij:b.brouwerij,plaats:b.plaats,land:b.land,stijl:b.stijl,abv:b.abv,smaken:b.smaken||[],omschrijving:b.omschrijving,thumb,...extra};
  applyBlind();
  try{S.room&&S.room.emit("nieuw",{tid})}catch(e){}
  return tid;
}
const writeErr=e=>e?.code==="invalid_argument"?"Je hebt in deze groep alleen leesrechten.":e?.code==="quota_exceeded"?"De opslag van deze groep is vol.":"Versturen mislukt. Probeer het opnieuw.";
const catMatch=b=>{const k=slug(b.naam+"-"+(b.brouwerij||""));return S.catalog.find(c=>slug(c.naam+"-"+c.brouwerij)===k)||S.catalog.find(c=>slug(c.naam)===slug(b.naam))};
async function startTasting(){
  const sc=S.scan,b=sc.beer;
  if(sc.editing){["naam","brouwerij","plaats","land"].forEach(k=>{const el=$("#f-"+k);if(el)b[k]=el.value.trim().slice(0,120)})}
  if(!b.naam){sc.error="Vul de naam van de wijn in.";render();return}
  if(!S.me){sc.error="Log in bij claude.ai om een proeverij te starten.";render();return}
  const c=catMatch(b);
  if(c){if(!b.stijl)b.stijl=c.stijl;if(!(b.druiven&&b.druiven.length))b.druiven=c.druiven;if(!b.prijs)b.prijs=c.prijs;if(!b.labels)b.labels=c.labels;if(!b.abv)b.abv=c.abv;if(!b.smaken?.length)b.smaken=c.smaken;if(!b.brouwerij)b.brouwerij=c.brouwerij;if(!b.land)b.land=c.land;if(!b.plaats)b.plaats=c.plaats}
  const btn=$("#start"); btn.disabled=true; btn.textContent="Versturen…";
  try{const tid=await createTasting(b,sc.thumb);
    S.scan={status:"idle",preview:null,blob:null,thumb:null,beer:null,editing:false,error:""};
    open(tid); toast("Vragenlijst verstuurd naar de groep");
  }catch(e){btn.disabled=false;btn.textContent="Start proeverij en stuur vragenlijst";sc.error=writeErr(e);render()}
}

  db.collection("prijzen").limit(3000).onSnapshot(s=>{const o={};s.docs.forEach(d=>{const v=d.data()||{};const pr=+v.prijs;if(!(pr>0&&pr<500))return;
    o[d.id]={prijs:pr,winkel:String(v.winkel||"").slice(0,40),inhoud:String(v.inhoud||"").slice(0,24),url:/^https:\/\//.test(v.url||"")?String(v.url).slice(0,400):"",at:+v.at||0}});S.prices=o;if(S.ready&&!S.spinning&&!S.addBeer)rerender()},()=>{});
  db.collection("catalog_extra").limit(1000).onSnapshot(s=>{S.catExtra=s.docs.map(d=>{const v=d.data()||{};return {naam:String(v.naam||"").slice(0,120),brouwerij:String(v.brouwerij||"").slice(0,120),plaats:String(v.plaats||"").slice(0,80),land:String(v.land||"").slice(0,60),stijl:String(v.stijl||"").slice(0,60),abv:String(v.abv||"").slice(0,6),druiven:Array.isArray(v.druiven)?v.druiven.filter(x=>typeof x==="string").slice(0,6).map(x=>x.slice(0,40)):[],prijs:typeof v.prijs==="number"&&v.prijs>0&&v.prijs<5000?v.prijs:0,smaken:Array.isArray(v.smaken)?v.smaken.filter(x=>TAGS.includes(x)).slice(0,8):[],by:v.by,at:v.at,bron:v.bron==="claude"?"claude":"",bronUrl:typeof v.bronUrl==="string"&&/^https:\/\//.test(v.bronUrl)?v.bronUrl.slice(0,500):"",extraId:d.id}}).filter(c=>c.naam);mergeCat();if(S.ready&&!S.addBeer)rerender()},()=>{});
  db.doc("meta/next").onSnapshot(d=>{const v=d.exists?d.data():null;const okS=x=>typeof x==="string"?x.slice(0,60):"";
    S.next=v&&(v.stijl||v.land||v.naam)?{stijl:okS(v.stijl)||(v.soort!=="land"&&groupOf(v.naam)?v.naam:""),land:okS(v.land)||(v.soort==="land"?okS(v.naam):""),by:v.by,at:v.at,landSkip:!!v.landSkip,locatie:okS(v.locatie),blind:!!v.blind,adres:typeof v.adres==="string"?v.adres.slice(0,120):"",rev:typeof v.rev==="number"?v.rev:0,datums:Array.isArray(v.datums)?v.datums.filter(x=>typeof x==="string"&&/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(x)).slice(0,12):[],datum:typeof v.datum==="string"&&/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(v.datum)?v.datum:""}:null;if(S.next)S.next.naam=themeName(S.next);setTimeout(syncAgendaFeed,1500);if(S.ready&&!S.spinning&&!S.addBeer&&!S.wheel)rerender()},()=>{});
  db.collection("datumstemmen").limit(500).onSnapshot(s=>{const o={};s.docs.forEach(d=>{const v=d.data()||{};if(v.keuzes&&typeof v.keuzes==="object")o[d.id]={round:v.round,keuzes:v.keuzes,at:v.at||0}});S.votes=o;if(S.ready&&!S.spinning&&!S.addBeer&&document.activeElement?.id!=="p-date"&&document.activeElement?.id!=="p-time")rerender()},()=>{});
  db.collection("names").limit(500).onSnapshot(s=>{const o={};s.docs.forEach(d=>{const v=d.data()?.naam;if(typeof v==="string"&&v.trim())o[d.id]=v.trim().slice(0,30)});S.nick=o;if(S.ready&&!(S.editName&&document.activeElement?.id==="nick"))rerender();fillNames()},()=>{});
  db.collection("beers").limit(1000).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.bRaw=o;applyBlind();if(!S.ready)mark();else rerender()},()=>{if(!S.ready)mark()});
})();
</script>
